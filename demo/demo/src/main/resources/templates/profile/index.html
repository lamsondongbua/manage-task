<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/main}">
<head>
    <title>Hồ sơ cá nhân</title>
</head>

<th:block layout:fragment="page-title">Hồ sơ cá nhân</th:block>
<th:block layout:fragment="page-subtitle">Quản lý thông tin tài khoản của bạn</th:block>

<th:block layout:fragment="content">
    <div class="card" style="max-width:600px; margin:0 auto;">
        <div class="card-header">
            <span class="card-title">Cập nhật thông tin</span>
        </div>
        <div style="padding:24px;">
            <form th:action="@{/web/profile/update}" method="post" th:object="${profileRequest}">
                <input type="hidden" th:name="${_csrf?.parameterName}" th:value="${_csrf?.token}"/>
                
                <div class="form-group" style="margin-bottom:16px;">
                    <label class="form-label" style="display:block;margin-bottom:8px;font-weight:500;color:var(--text-primary)">Họ và Tên <span style="color:var(--danger)">*</span></label>
                    <input type="text" th:field="*{name}" class="form-control" style="width:100%;padding:10px;border-radius:6px;border:1px solid var(--border-color);background:var(--bg-secondary);color:var(--text-primary)"/>
                    <div th:if="${#fields.hasErrors('name')}" th:errors="*{name}" style="color:var(--danger);font-size:12px;margin-top:4px;"></div>
                </div>

                <div class="form-group" style="margin-bottom:24px;">
                    <label class="form-label" style="display:block;margin-bottom:8px;font-weight:500;color:var(--text-primary)">Số điện thoại</label>
                    <input type="text" th:field="*{phone}" class="form-control" style="width:100%;padding:10px;border-radius:6px;border:1px solid var(--border-color);background:var(--bg-secondary);color:var(--text-primary)" placeholder="Ví dụ: 0912345678"/>
                    <div th:if="${#fields.hasErrors('phone')}" th:errors="*{phone}" style="color:var(--danger);font-size:12px;margin-top:4px;"></div>
                </div>

                <div class="form-actions" style="display:flex;justify-content:flex-end;gap:12px;">
                    <a th:href="@{/web/dashboard}" class="btn btn-secondary">Quay lại</a>
                    <button type="submit" class="btn btn-primary">Lưu thay đổi</button>
                </div>
            </form>
        </div>
    </div>
</th:block>
</html>
