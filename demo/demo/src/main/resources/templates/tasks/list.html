<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/main}">
<head><title>Danh sách Task</title></head>

<th:block layout:fragment="page-title">Công việc</th:block>
<th:block layout:fragment="page-subtitle">Quản lý tất cả công việc của bạn</th:block>

<th:block layout:fragment="topbar-actions">
    <a th:href="@{/web/tasks/create}" class="btn btn-primary">
        <i class="bi bi-plus-lg"></i> Thêm Task
    </a>
</th:block>

<th:block layout:fragment="content">
    <div class="card">
        <div th:if="${#lists.isEmpty(tasksPage.content)}" class="empty-state">
            <div class="empty-state-icon">📋</div>
            <div class="empty-state-text">Chưa có task nào</div>
            <div class="empty-state-sub">Bắt đầu bằng cách tạo task đầu tiên của bạn</div>
            <a th:href="@{/web/tasks/create}" class="btn btn-primary">
                <i class="bi bi-plus-lg"></i> Tạo Task
            </a>
        </div>

        <div th:unless="${#lists.isEmpty(tasksPage.content)}">
            <div class="table-wrapper">
                <table>
                    <thead>
                        <tr>
                            <th>#</th>
                            <th>Tiêu đề</th>
                            <th>Dự án</th>
                            <th>Trạng thái</th>
                            <th>Độ ưu tiên</th>
                            <th>Hạn chót</th>
                            <th>Hành động</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr th:each="task : ${tasksPage.content}">
                            <td style="color:var(--text-muted);font-size:12px" th:text="${task.id}">1</td>
                            <td>
                                <a th:href="@{/web/tasks/{id}(id=${task.id})}"
                                   th:text="${task.title}"
                                   style="font-weight:500;color:var(--text-primary)">Task title</a>
                            </td>
                            <td>
                                <span th:if="${task.project != null}" th:text="${task.project.name}"
                                      style="font-size:13px;color:var(--text-secondary)">—</span>
                                <span th:unless="${task.project != null}" style="color:var(--text-muted)">—</span>
                            </td>
                            <td>
                                <span th:switch="${task.status?.name()}">
                                    <span th:case="'TODO'" class="badge badge-todo"><i class="bi bi-circle"></i> To Do</span>
                                    <span th:case="'IN_PROGRESS'" class="badge badge-in-progress"><i class="bi bi-arrow-repeat"></i> In Progress</span>
                                    <span th:case="'DONE'" class="badge badge-done"><i class="bi bi-check-circle-fill"></i> Done</span>
                                    <span th:case="'CANCELLED'" class="badge badge-cancelled"><i class="bi bi-x-circle-fill"></i> Cancelled</span>
                                </span>
                            </td>
                            <td>
                                <span th:switch="${task.priority?.name()}">
                                    <span th:case="'LOW'" class="badge badge-low">Low</span>
                                    <span th:case="'MEDIUM'" class="badge badge-medium">Medium</span>
                                    <span th:case="'HIGH'" class="badge badge-high">High</span>
                                    <span th:case="'URGENT'" class="badge badge-urgent"><i class="bi bi-fire"></i> Urgent</span>
                                </span>
                            </td>
                            <td style="font-size:13px;color:var(--text-secondary)"
                                th:text="${task.dueDate != null ? #temporals.format(task.dueDate, 'dd/MM/yyyy') : '—'}">—</td>
                            <td>
                                <div style="display:flex;gap:6px">
                                    <a th:href="@{/web/tasks/{id}(id=${task.id})}"
                                       class="btn btn-secondary btn-sm" title="Xem chi tiết">
                                        <i class="bi bi-eye"></i>
                                    </a>
                                    <a th:href="@{/web/tasks/{id}/edit(id=${task.id})}"
                                       class="btn btn-secondary btn-sm" title="Chỉnh sửa">
                                        <i class="bi bi-pencil"></i>
                                    </a>
                                    <form th:action="@{/web/tasks/{id}/delete(id=${task.id})}" method="post"
                                          onsubmit="return confirm('Bạn có chắc muốn xóa task này?')">
                                        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
                                        <button type="submit" class="btn btn-danger btn-sm" title="Xóa">
                                            <i class="bi bi-trash"></i>
                                        </button>
                                    </form>
                                </div>
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>

            <!-- Pagination -->
            <div class="pagination" th:if="${totalPages > 1}">
                <a th:href="@{/web/tasks(page=${currentPage - 1})}"
                   th:classappend="${currentPage == 0} ? 'disabled' : ''"
                   class="page-link">
                    <i class="bi bi-chevron-left"></i>
                </a>
                <th:block th:each="i : ${#numbers.sequence(0, totalPages - 1)}">
                    <a th:href="@{/web/tasks(page=${i})}"
                       th:text="${i + 1}"
                       th:classappend="${i == currentPage} ? 'active' : ''"
                       class="page-link">1</a>
                </th:block>
                <a th:href="@{/web/tasks(page=${currentPage + 1})}"
                   th:classappend="${currentPage >= totalPages - 1} ? 'disabled' : ''"
                   class="page-link">
                    <i class="bi bi-chevron-right"></i>
                </a>
            </div>
        </div>
    </div>
</th:block>
</html>
