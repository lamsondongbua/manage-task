<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/main}">
<head><title th:text="${isEdit} ? 'Chỉnh sửa Task' : 'Tạo Task mới'">Task Form</title></head>

<th:block layout:fragment="page-title"
          th:text="${isEdit} ? 'Chỉnh sửa Task' : 'Tạo Task mới'">Task Form</th:block>
<th:block layout:fragment="page-subtitle"
          th:text="${isEdit} ? 'Cập nhật thông tin task' : 'Điền thông tin để tạo task mới'">Subtitle</th:block>

<th:block layout:fragment="topbar-actions">
    <a th:href="@{/web/tasks}" class="btn btn-secondary btn-sm">
        <i class="bi bi-arrow-left"></i> Quay lại
    </a>
</th:block>

<th:block layout:fragment="content">
    <div style="max-width:700px">
        <div class="card">
            <form th:action="${isEdit} ? @{/web/tasks/{id}/edit(id=${taskId})} : @{/web/tasks/create}"
                  th:object="${taskForm}"
                  method="post">
                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>

                <!-- Title -->
                <div class="form-group">
                    <label class="form-label" for="title">
                        <i class="bi bi-type"></i> Tiêu đề <span style="color:var(--accent-danger)">*</span>
                    </label>
                    <input type="text" id="title" th:field="*{title}"
                           class="form-control"
                           th:classappend="${#fields.hasErrors('title')} ? 'is-invalid' : ''"
                           placeholder="Nhập tiêu đề task..."/>
                    <div class="form-error" th:if="${#fields.hasErrors('title')}" th:errors="*{title}"></div>
                </div>

                <!-- Description -->
                <div class="form-group">
                    <label class="form-label" for="description">
                        <i class="bi bi-text-paragraph"></i> Mô tả
                    </label>
                    <textarea id="description" th:field="*{description}"
                              class="form-control"
                              placeholder="Mô tả chi tiết về task..."></textarea>
                </div>

                <!-- Status + Priority -->
                <div class="form-row">
                    <div class="form-group">
                        <label class="form-label" for="status">
                            <i class="bi bi-flag"></i> Trạng thái
                        </label>
                        <select id="status" th:field="*{status}" class="form-control">
                            <option th:each="s : ${statuses}"
                                    th:value="${s}"
                                    th:text="${s.name()}">Status</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label class="form-label" for="priority">
                            <i class="bi bi-bar-chart"></i> Độ ưu tiên
                        </label>
                        <select id="priority" th:field="*{priority}" class="form-control">
                            <option th:each="p : ${priorities}"
                                    th:value="${p}"
                                    th:text="${p.name()}">Priority</option>
                        </select>
                    </div>
                </div>

                <!-- Project + Due Date -->
                <div class="form-row">
                    <div class="form-group">
                        <label class="form-label" for="projectId">
                            <i class="bi bi-folder2-open"></i> Dự án <span style="color:var(--accent-danger)">*</span>
                        </label>
                        <select id="projectId" th:field="*{projectId}" class="form-control"
                                th:classappend="${#fields.hasErrors('projectId')} ? 'is-invalid' : ''">
                            <option value="">-- Chọn dự án --</option>
                            <option th:each="project : ${projects}"
                                    th:value="${project.id}"
                                    th:text="${project.name}">Project</option>
                        </select>
                        <div class="form-error" th:if="${#fields.hasErrors('projectId')}" th:errors="*{projectId}"></div>
                    </div>
                    <div class="form-group">
                        <label class="form-label" for="dueDate">
                            <i class="bi bi-calendar3"></i> Hạn chót
                        </label>
                        <input type="date" id="dueDate" th:field="*{dueDate}" class="form-control"/>
                    </div>
                </div>

                <!-- Buttons -->
                <div style="display:flex;gap:12px;margin-top:8px">
                    <button type="submit" class="btn btn-primary">
                        <i th:class="${isEdit} ? 'bi bi-check-lg' : 'bi bi-plus-lg'"></i>
                        <span th:text="${isEdit} ? 'Lưu thay đổi' : 'Tạo Task'">Submit</span>
                    </button>
                    <a th:href="@{/web/tasks}" class="btn btn-secondary">Hủy</a>
                </div>
            </form>
        </div>
    </div>
</th:block>
</html>
