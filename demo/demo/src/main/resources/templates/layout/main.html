<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title layout:title-pattern="$CONTENT_TITLE — Manage Task">Manage Task</title>
    <!-- App CSS -->
    <link rel="stylesheet" th:href="@{/css/app.css}"/>
    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"/>
    <th:block layout:fragment="head"></th:block>
</head>
<body>
<div class="app-wrapper">

    <!-- ===== SIDEBAR ===== -->
    <aside class="sidebar">
        <div class="sidebar-logo">
            <div class="logo-icon">✓</div>
            <span class="logo-text">Manage Task</span>
        </div>

        <nav class="sidebar-nav">
            <span class="nav-section-label">Tổng quan</span>
            <a th:href="@{/web/dashboard}"
               th:classappend="${activePage == 'dashboard'} ? 'active' : ''"
               class="nav-item">
                <span class="nav-icon"><i class="bi bi-grid-1x2-fill"></i></span>
                Dashboard
            </a>

            <span class="nav-section-label">Quản lý</span>
            <a th:href="@{/web/tasks}"
               th:classappend="${activePage == 'tasks'} ? 'active' : ''"
               class="nav-item">
                <span class="nav-icon"><i class="bi bi-check2-square"></i></span>
                Công việc
            </a>
            <a th:href="@{/web/projects}"
               th:classappend="${activePage == 'projects'} ? 'active' : ''"
               class="nav-item">
                <span class="nav-icon"><i class="bi bi-folder2-open"></i></span>
                Dự án
            </a>
        </nav>

        <div class="sidebar-footer">
            <div class="user-card">
                <div class="user-avatar">
                    <span sec:authentication="name" th:text="${#strings.substring(#authentication.name, 0, 1).toUpperCase()}">U</span>
                </div>
                <a th:href="@{/web/profile}" class="user-info" style="text-decoration:none; color:inherit; flex:1; cursor:pointer;" title="Chỉnh sửa hồ sơ">
                    <div class="user-name" sec:authentication="name">User</div>
                    <div class="user-role">Member <i class="bi bi-pencil-square" style="font-size:0.8em; margin-left:4px;"></i></div>
                </a>
                <form th:action="@{/web/logout}" method="post" style="display:inline">
                    <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
                    <button type="submit" class="logout-btn" title="Đăng xuất">
                        <i class="bi bi-box-arrow-right"></i>
                    </button>
                </form>
            </div>
        </div>
    </aside>

    <!-- ===== MAIN CONTENT ===== -->
    <main class="main-content">
        <!-- Topbar -->
        <header class="topbar">
            <div>
                <div class="topbar-title" layout:fragment="page-title">Dashboard</div>
                <div class="topbar-subtitle" layout:fragment="page-subtitle">Xin chào trở lại! 👋</div>
            </div>
            <div layout:fragment="topbar-actions"></div>
        </header>

        <!-- Page Content -->
        <div class="page-container">
            <!-- Flash messages -->
            <div th:if="${successMessage}" class="alert alert-success">
                <i class="bi bi-check-circle-fill"></i>
                <span th:text="${successMessage}">Success</span>
            </div>
            <div th:if="${errorMessage}" class="alert alert-danger">
                <i class="bi bi-exclamation-triangle-fill"></i>
                <span th:text="${errorMessage}">Error</span>
            </div>

            <!-- Main slot -->
            <div layout:fragment="content">
                <!-- Page-specific content goes here -->
            </div>
        </div>
    </main>
</div>

<th:block layout:fragment="scripts"></th:block>
</body>
</html>
