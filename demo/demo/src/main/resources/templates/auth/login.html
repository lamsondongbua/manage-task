<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Đăng nhập — Manage Task</title>
    <link rel="stylesheet" th:href="@{/css/app.css}"/>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"/>
</head>
<body style="display:block; margin:0; padding:0;">

<div class="login-page">
    <div class="login-card">

        <!-- Logo -->
        <div class="login-logo">
            <div class="logo-icon">✓</div>
            <span class="logo-text">Manage Task</span>
        </div>

        <h1 class="login-title">Chào mừng trở lại</h1>
        <p class="login-subtitle">Đăng nhập để quản lý công việc của bạn</p>

        <!-- Alerts -->
        <div th:if="${errorMessage}" class="alert alert-danger">
            <i class="bi bi-exclamation-triangle-fill"></i>
            <span th:text="${errorMessage}">Lỗi đăng nhập</span>
        </div>
        <div th:if="${logoutMessage}" class="alert alert-success">
            <i class="bi bi-check-circle-fill"></i>
            <span th:text="${logoutMessage}">Đã đăng xuất</span>
        </div>

        <!-- Login Form -->
        <form th:action="@{/web/login}" method="post" id="login-form">
            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>

            <div class="form-group">
                <label class="form-label" for="email">
                    <i class="bi bi-envelope"></i> Email
                </label>
                <input type="email"
                       id="email"
                       name="email"
                       class="form-control"
                       placeholder="your@email.com"
                       autocomplete="email"
                       required/>
            </div>

            <div class="form-group">
                <label class="form-label" for="password">
                    <i class="bi bi-lock"></i> Mật khẩu
                </label>
                <div style="position:relative">
                    <input type="password"
                           id="password"
                           name="password"
                           class="form-control"
                           placeholder="••••••••"
                           autocomplete="current-password"
                           required
                           style="padding-right: 44px"/>
                    <button type="button" id="toggle-password"
                            style="position:absolute;right:12px;top:50%;transform:translateY(-50%);background:none;border:none;cursor:pointer;color:var(--text-muted);font-size:16px">
                        <i class="bi bi-eye" id="eye-icon"></i>
                    </button>
                </div>
            </div>

            <button type="submit" class="btn btn-primary" style="width:100%;justify-content:center;margin-top:8px">
                <i class="bi bi-box-arrow-in-right"></i>
                Đăng nhập
            </button>
        </form>

    </div>
</div>

<script>
    // Toggle password visibility
    document.getElementById('toggle-password').addEventListener('click', function () {
        const input = document.getElementById('password');
        const icon = document.getElementById('eye-icon');
        if (input.type === 'password') {
            input.type = 'text';
            icon.className = 'bi bi-eye-slash';
        } else {
            input.type = 'password';
            icon.className = 'bi bi-eye';
        }
    });
</script>
</body>
</html>
